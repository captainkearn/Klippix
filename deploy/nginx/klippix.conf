server {
    listen 8020 default_server;
    listen [::]:8020 default_server;
    server_name _;

    # Loopback, RFC 1918, IPv4 link-local, IPv6 unique-local and link-local.
    allow 127.0.0.0/8;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 169.254.0.0/16;
    allow ::1/128;
    allow fc00::/7;
    allow fe80::/10;
    deny all;

    root /usr/share/klippix/web;
    index index.html;

    server_tokens off;
    client_max_body_size 32m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Protect the GUI and file API. The terminal additionally uses /bin/login.
    auth_basic "Klippix";
    auth_basic_user_file /etc/klippix/htpasswd;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /terminal/ {
        proxy_pass http://127.0.0.1:8021/terminal/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8022/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }
}
